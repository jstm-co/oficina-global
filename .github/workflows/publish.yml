# Publishes package changes merged into main with a UTC date-based version.
# No npm token: npm trusts this workflow (trusted publishing, OIDC) and adds provenance.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'jstm-co/oficina-global'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # tag and GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Calculate the next release
        id: v
        run: node scripts/version.mjs release

      - name: npm with trusted publishing (>= 11.5.1)
        if: steps.v.outputs.publish == 'true'
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          npm --version

      - if: steps.v.outputs.publish == 'true'
        run: npm ci

      - name: Set the version only inside this runner
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - if: steps.v.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.v.outputs.publish == 'true'
        run: npm test
      - if: steps.v.outputs.publish == 'true'
        env:
          OFICINA_VERSION: ${{ steps.v.outputs.version }}
        run: npm run build
      - if: steps.v.outputs.publish == 'true'
        name: Package contents
        run: node .github/scripts/check-package.mjs

      - name: Publish
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          npm publish --access public
          echo "Published **${{ steps.v.outputs.name }}@$VERSION** to npm." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and GitHub Release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
